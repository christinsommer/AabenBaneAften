name: Operations backup
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/operations-backup.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OPERATIONS_CLOUDFLARE_API_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-database-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/operations/database.sql.enc
          if-no-files-found: error
          retention-days: 30
      - name: Confirm uploaded backup
        run: node --input-type=module -e "import {heartbeat} from './scripts/operations-lib.mjs'; await heartbeat('backup');"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OPERATIONS_CLOUDFLARE_API_TOKEN }}
      - name: Alert on failure
        if: failure()
        run: node scripts/operations-failure.mjs backup
        env:
          RESEND_API_KEY: ${{ secrets.OPERATIONS_RESEND_API_KEY }}
